<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopping Guru - Best Deals with Share</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:9999;display:none}
.card{transition:all .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(0,0,0,.12)}
</style>
</head><body class="bg-[#fafafa]">
<header class="bg-black text-white sticky top-0 z-10">
<div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
<h1 class="font-bold text-lg">🛒 Shopping Guru</h1>
<button onclick="shareStore()" class="bg-white text-black text-sm px-3 py-1.5 rounded-full font-semibold">↗ Share Store</button>
</div>
</header>

<main class="max-w-6xl mx-auto p-4">
<div class="bg-yellow-50 border border-yellow-200 p-3 rounded-xl text-sm mb-6">
<b>Admin ke liye:</b> Is file ko GitHub pe <code>index.html</code> naam se daalo. Naya product add karna ho to Admin Panel se <b>Export</b> karke is file ko update karo. Share buttons automatic kaam karenge.
</div>

<div id="products" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
</main>

<div id="toast" class="toast">Link Copied!</div>

<script>
const demo = [
{title:"Apple iPhone 15 (128GB) - Black", price:"70,900", mrp:"79,900", image:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500", link:"https://www.amazon.in/dp/B0CHX1W1XY?tag=mystore-21"},
{title:"Sony WH-1000XM5 Wireless Headphone", price:"26,990", mrp:"34,990", image:"https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=500", link:"https://www.amazon.in/dp/B0B3M9XX9M?tag=mystore-21"},
{title:"Nike Air Max Shoes - Mens", price:"7,495", mrp:"9,995", image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500", link:"https://www.flipkart.com/nike-shoes/p/itm123?affid=mystore"}
];

function getProducts(){
 try{
  const saved = JSON.parse(localStorage.getItem('affiliate_products')||'[]');
  if(saved.length) return saved.map(s=>({title:s.title||s.name, price:s.price, mrp:s.mrp, image:(s.images&&s.images[0])||s.image, link:s.affiliateLink||s.link}));
 }catch(e){}
 return demo;
}

function shareWA(link,text){
 const url = `https://wa.me/?text=${encodeURIComponent(text + ' - ' + link)}`;
 window.open(url,'_blank');
}
function shareFB(link){
 const url = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}`;
 window.open(url,'_blank','width=600,height=400');
}
function shareTG(link,text){
 const url = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`;
 window.open(url,'_blank');
}
function copyLink(link){
 navigator.clipboard.writeText(link).then(()=>showToast('Link Copied! ✅')).catch(()=>{
   const ta=document.createElement('textarea');ta.value=link;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();showToast('Link Copied! ✅');
 });
}
function showToast(msg){
 const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block';
 setTimeout(()=>t.style.display='none',2000);
}
function shareStore(){
 const storeLink = window.location.href;
 if(navigator.share){navigator.share({title:'Shopping Guru - Best Deals', url:storeLink});}
 else{copyLink(storeLink);}
}

function render(){
 const wrap=document.getElementById('products');
 const products=getProducts();
 wrap.innerHTML='';
 products.forEach(p=>{
  const disc = p.mrp ? Math.round((parseInt(p.mrp.replace(/,/g,''))-parseInt(p.price.replace(/,/g,'')))/parseInt(p.mrp.replace(/,/g,''))*100) : 0;
  const card=document.createElement('div');
  card.className='card bg-white border border-zinc-200 rounded-[18px] overflow-hidden';
  card.innerHTML=`
   <div class="aspect-[4/3] bg-zinc-100 overflow-hidden"><img src="${p.image}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400?text=Product'"></div>
   <div class="p-4">
    <h3 class="font-bold text-[15px] leading-tight line-clamp-2">${p.title}</h3>
    <div class="flex items-baseline gap-2 mt-2"><span class="text-xl font-extrabold">₹${p.price}</span>${p.mrp?`<span class="text-sm line-through text-zinc-500">₹${p.mrp}</span><span class="text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded font-bold">${disc}% OFF</span>`:''}</div>
    <a href="${p.link}" target="_blank" class="mt-3 block text-center bg-[#ff6a00] hover:bg-[#e65f00] text-white font-bold py-2.5 rounded-xl">BUY NOW →</a>
    <div class="mt-3 pt-3 border-t border-zinc-100">
     <p class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wide mb-2">Share with friends:</p>
     <div class="grid grid-cols-4 gap-2">
      <button onclick="shareWA('${p.link.replace(/'/g,"\\'")}','${p.title.replace(/'/g,"\\'")}')" class="flex flex-col items-center gap-1 p-2 rounded-xl bg-[#f6f6f6] hover:bg-[#e6ffea] border"><span class="text-lg">💬</span><span class="text-[10px] font-bold">WhatsApp</span></button>
      <button onclick="shareFB('${p.link.replace(/'/g,"\\'")}')" class="flex flex-col items-center gap-1 p-2 rounded-xl bg-[#f6f6f6] hover:bg-[#e6f0ff] border"><span class="text-lg">📘</span><span class="text-[10px] font-bold">Facebook</span></button>
      <button onclick="shareTG('${p.link.replace(/'/g,"\\'")}','${p.title.replace(/'/g,"\\'")}')" class="flex flex-col items-center gap-1 p-2 rounded-xl bg-[#f6f6f6] hover:bg-[#e6f6ff] border"><span class="text-lg">✈️</span><span class="text-[10px] font-bold">Telegram</span></button>
      <button onclick="copyLink('${p.link.replace(/'/g,"\\'")}')" class="flex flex-col items-center gap-1 p-2 rounded-xl bg-[#f6f6f6] hover:bg-zinc-200 border"><span class="text-lg">🔗</span><span class="text-[10px] font-bold">Copy</span></button>
     </div>
    </div>
    <p class="text-[10px] text-zinc-400 mt-2 text-center">Affiliate Link • Secure Checkout</p>
   </div>
  `;
  wrap.appendChild(card);
 });
}
render();
</script>

<footer class="text-center text-xs text-zinc-500 py-6">As an Amazon Associate & Flipkart Affiliate we earn from qualifying purchases.</footer>
</body></html>
